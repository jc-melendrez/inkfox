# Redraft Nginx site (Amazon Linux 2023 / RHEL layout).
# Install:
#   sudo cp deploy/nginx/foxtutor.conf /etc/nginx/conf.d/foxtutor.conf
#   sudo nginx -t && sudo systemctl reload nginx
# IP-only demo: default_server + server_name _; the public IP is not baked in,
# so the site survives an EC2 stop/start (run deploy/set-ip.sh after it changes).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Django caps uploads at 10 MB; allow a little more than that.
    client_max_body_size 12m;

    # The React build, uploaded from your laptop (see deploy/README.md).
    root /srv/foxtutor/frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Security headers, mirroring Django's. Keep them here (server level) so they
    # are inherited everywhere; do not add_header inside a location or these drop.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # CSP for the SPA. connect-src 'self' covers the same-origin /api. If the UI
    # ever looks unstyled, relax style-src first.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Enable only once HTTPS works (and only with a domain):
    # add_header Strict-Transport-Security "max-age=3600" always;

    # --- API + Django admin -> Gunicorn ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above Gunicorn's 120s timeout so slow AI calls surface the app's error.
        proxy_read_timeout 130s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin assets (collectstatic output).
    location /static/ {
        alias /srv/foxtutor/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Vite hashed assets are content-addressed and never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # React Router deep links (e.g. /library on refresh) fall back to the shell.
    location / {
        try_files $uri /index.html;
        expires -1;
    }

    # Never serve secrets, source or data by URL (defence in depth; the web root
    # is already just the built frontend).
    location ~ /\.(env|git|venv) { deny all; }
    location ^~ /media/ { return 404; }
    location ~* \.(sqlite3|py|pyc)$ { return 404; }
}
